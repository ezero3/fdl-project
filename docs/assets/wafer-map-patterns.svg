<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Examples of semiconductor wafer maps</title>
  <desc id="desc">Three stylized wafer maps showing center, edge-ring, and scratch defect patterns.</desc>
  <defs>
    <pattern id="dies" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" rx="2" fill="#9bd3ae" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <clipPath id="wafer1"><circle cx="180" cy="170" r="118"/></clipPath>
    <clipPath id="wafer2"><circle cx="500" cy="170" r="118"/></clipPath>
    <clipPath id="wafer3"><circle cx="820" cy="170" r="118"/></clipPath>
  </defs>
  <rect width="1000" height="360" rx="18" fill="#f5f7fa"/>
  <g stroke="#315d6b" stroke-width="5">
    <circle cx="180" cy="170" r="120" fill="url(#dies)"/>
    <circle cx="500" cy="170" r="120" fill="url(#dies)"/>
    <circle cx="820" cy="170" r="120" fill="url(#dies)"/>
  </g>
  <g fill="#e55252" opacity="0.95" clip-path="url(#wafer1)">
    <rect x="145" y="135" width="16" height="16"/><rect x="163" y="135" width="16" height="16"/><rect x="181" y="135" width="16" height="16"/>
    <rect x="127" y="153" width="16" height="16"/><rect x="145" y="153" width="16" height="16"/><rect x="163" y="153" width="16" height="16"/><rect x="181" y="153" width="16" height="16"/><rect x="199" y="153" width="16" height="16"/>
    <rect x="145" y="171" width="16" height="16"/><rect x="163" y="171" width="16" height="16"/><rect x="181" y="171" width="16" height="16"/>
  </g>
  <g fill="none" stroke="#e55252" stroke-width="17" clip-path="url(#wafer2)">
    <circle cx="500" cy="170" r="96"/>
  </g>
  <g fill="#e55252" clip-path="url(#wafer3)" transform="rotate(-28 820 170)">
    <rect x="807" y="48" width="20" height="244" rx="5"/>
    <rect x="831" y="90" width="15" height="170" rx="4"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#243642">
    <text x="180" y="325" font-size="22" font-weight="700">Center</text>
    <text x="500" y="325" font-size="22" font-weight="700">Edge-Ring</text>
    <text x="820" y="325" font-size="22" font-weight="700">Scratch</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#243642">
    <rect x="765" y="18" width="14" height="14" rx="2" fill="#9bd3ae"/><text x="786" y="30">passing die</text>
    <rect x="875" y="18" width="14" height="14" rx="2" fill="#e55252"/><text x="896" y="30">failing die</text>
  </g>
</svg>
