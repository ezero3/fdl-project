# Focal gamma 1.0 on top of the sampler -- milder suppression of examples the model already gets right, which is the direction that least fights the sampler.
name: baseline_cnn-rotation-focal_g1-sampler

model:
  name: baseline_cnn
  kwargs: {dropout: 0.2}

data:
  augmentation:
    name: rotation
    probability: 0.5
    kwargs: {degrees: 180.0}

imbalance:
  name: focal_sampler_g1
  loss: focal
  focal_gamma: 1.0
  sampling: weighted
  sampling_weighting: inverse_sqrt
