# Shared defaults for every training config in this directory.
#
# An experiment file only states what it changes; this file is deep-merged
# underneath it. Unknown keys are a hard error, so a typo stops the run
# instead of silently training the default.

seed: 86

data:
  dataset_path: data/MIR-WM811K/WM811K.pkl
  split_directory: data/splits
  # Measured on a Colab T4 (8 vCPUs): 2 -> 8 workers was a 1.9x speedup on the
  # 64x64 models, which are dataloader-bound, not GPU-bound. See
  # docs/phase0-results.md. Lower it only if the machine has fewer cores.
  num_workers: 8
  pin_memory: true
  # Copy this split's raw uint8 maps into memory (~350 MB for all labeled
  # data) and drop the 2 GB source table. Geometry and encoding still run per
  # batch; caching the preprocessed float tensors would be ~8.5 GB at 64x64.
  cache: true
  # subset: 2000          # smoke tests only; never set for a real run
  preprocessing:
    target_size: [64, 64]
    geometry: letterbox   # aspect-ratio preserving; see docs/design-notes.md
    encoding: one_hot     # 3 channels: background / functional / defective die
    normalization: none
  # Train-only. 'dihedral8' is the 4 rotations by 90 degrees and their mirrors:
  # index permutations, so no interpolation and no invalid cell states, and
  # every one of them preserves the label. Free-angle rotation and translation
  # are deliberately unavailable -- see docs/ROADMAP.md item 10.
  augmentation:
    # null (default, off) | dihedral8 | rotations | flips | rotation
    #   dihedral8  all 8 square symmetries (D4)      exact permutation
    #   rotations  the 4 rotations by 90 degrees     exact permutation
    #   flips      identity, horizontal, vertical    exact permutation
    #   rotation   free angle, nearest neighbour     resamples; see item 10
    # The three subgroups are closed, so comparing them compares structure
    # rather than noise level. `rotation` is the only one that resamples;
    # measured defect loss is under 1% and no wafer loses its pattern.
    name: null
    # Chance a sample is touched at all -- NOT a strength dial. The identity is
    # already one of the 8 group elements, so at 1.0 a sample is unchanged 12.5%
    # of the time; at 0.5 it is unchanged 56%. Keep it at 1.0 for the exact
    # subsets: that makes the training distribution uniform over the group, and
    # the orientation the fab recorded has no special status. It is a real knob
    # only for `rotation`, where it trades augmentation against keeping clean
    # unresampled examples.
    probability: 1.0
    kwargs: {}            # rotation takes: {degrees: 180.0}
    # Optional: augment some classes more than others. Classes not listed keep
    # `probability`. Only the exact-permutation options may vary by class --
    # `rotation` resamples, and applying that unevenly would let the network
    # read the augmentation as a class hint instead of learning the defect.
    # Note the weighted sampler already compounds with augmentation: a rare
    # wafer drawn 40x an epoch already yields 40 different views.
    #   class_probabilities: {Scratch: 1.0, Near-full: 1.0, none: 0.0}
    class_probabilities: {}

# The validated policy from the class-imbalance experiment. Presets:
# unweighted_ce, inverse_sqrt_ce, effective_number_ce, inverse_sqrt_sampler,
# focal_loss.
imbalance:
  preset: inverse_sqrt_sampler

model:
  name: baseline_cnn
  kwargs: {}

optimizer:
  name: adamw
  kwargs:
    # Square-root scaled for batch 256 (was 1.0e-3 at batch 512). Changing the
    # batch without rescaling the learning rate conflates two variables.
    lr: 7.0e-4
    weight_decay: 1.0e-4
  # param_groups lets one model train at several learning rates at once;
  # see configs/train/resnet18_224_finetune.yaml.
  param_groups: []

scheduler:
  name: null              # null keeps the learning rate constant
  interval: epoch
  kwargs: {}

trainer:
  max_epochs: 50
  # Throughput on the 64x64 models is flat from batch 64 to 1024 (the GPU sits
  # at ~15% while the CPU transforms), so a large batch buys no speed and costs
  # optimizer steps: 512 gives 237 steps/epoch against 473 at 256.
  batch_size: 256
  max_gradient_norm: 5.0
  amp: true               # fp16 on CUDA; ignored on CPU and MPS
  device: auto
  early_stopping:
    monitor: validation_macro_f1
    mode: max
    # Raised from 5 after the phase-2 sweep: validation macro-F1 is noisy
    # enough that patience 5 ended unregularised arms at epoch 10 while
    # regularised ones ran to 28, so the comparison partly measured which arm
    # survived early stopping rather than which arm was better.
    patience: 10
    min_epochs: 5

checkpoint:
  # On Colab point this at mounted Drive:
  #   /content/drive/MyDrive/fdl-project/checkpoints
  # Local disk there is wiped when the session drops.
  directory: trained-models/checkpoints
  # Rolling per-epoch history. A ResNet18 checkpoint is ~140 MB (weights plus
  # AdamW moments), so each retained epoch is expensive on a 15 GB Drive.
  # Resume reads the newest of them; the rest are just for stepping back.
  keep_last: 2
  save_best: true
  resume: auto

logging:
  output_root: output/runs
  wandb:
    enabled: false        # turn on per config, or with --override
    entity: null          # the shared team, once it exists
    project: wm811k-wafer-defects
    mode: online          # 'offline' works without an account; sync later
    tags: []
