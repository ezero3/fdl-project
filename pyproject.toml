[project]
name = "fdl-project"
version = "0.1.0"
description = "Deep learning classification of failure patterns in the WM-811K wafer-map dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
]
