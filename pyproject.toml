[project]
name = "fdl-project"
version = "0.1.0"
description = "Deep learning classification of failure patterns in the WM-811K wafer-map dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
logging = ["wandb>=0.18,<1"]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "nbconvert>=7.16,<8",
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdl_project"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
